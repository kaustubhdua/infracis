name: Geocode candidate diagnostic

on:
  push:
    branches:
      - diag/geocode-candidates-2026-10-29

permissions:
  contents: read

concurrency:
  group: infracis-geocode-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run bounded live Nominatim diagnostic
        run: node scripts/geocode-diagnostic.mjs
      - name: Upload candidate report
        uses: actions/upload-artifact@v4
        with:
          name: infracis-geocode-diagnostic
          path: geocode-diagnostic.json
          if-no-files-found: error
          retention-days: 7
