name: Live provider pilot

on:
  push:
    branches: [pilot/overpass-smoke]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infracis-provider-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: pilot/overpass-smoke
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe real providers across Delhi NCR sample
        env:
          PILOT_SAMPLE_LIMIT: "1"
          OVERPASS_API_URLS: "https://overpass-api.de/api/interpreter;https://overpass.private.coffee/api/interpreter;https://maps.mail.ru/osm/tools/overpass/api/interpreter"
        run: node scripts/provider-pilot.mjs
      - name: Upload measured pilot report
        uses: actions/upload-artifact@v4
        with:
          name: infracis-provider-pilot
          path: |
            provider-pilot-report.json
            provider-pilot-report.md
          if-no-files-found: error
          retention-days: 30
