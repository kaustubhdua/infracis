name: Live provider pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infracis-provider-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe real providers across Delhi NCR sample
        run: node scripts/provider-pilot.mjs
      - name: Upload measured pilot report
        uses: actions/upload-artifact@v4
        with:
          name: infracis-provider-pilot
          path: |
            provider-pilot-report.json
            provider-pilot-report.md
          if-no-files-found: error
          retention-days: 30
