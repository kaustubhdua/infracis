name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Capture resolved backend dependency versions
        run: python -m pip freeze > requirements-lock.txt && cat requirements-lock.txt
      - name: Audit installed backend dependencies
        run: python -m pip install pip-audit && pip-audit
      - name: Run backend tests
        env:
          APP_ENV: test
          INFRACIS_API_KEY: test-only-secret
        run: pytest -q
